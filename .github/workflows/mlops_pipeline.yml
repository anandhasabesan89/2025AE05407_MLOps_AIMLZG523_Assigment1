name: Cardio-Risk End-to-End MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  MLFLOW_ALLOW_FILE_STORE: "true"
  MLFLOW_DISABLE_AGENT_HINT: "1"
  GIT_PYTHON_REFRESH: "quiet"
  MPLBACKEND: "Agg"

jobs:
  lint-and-unit-test:
    name: 1. Code Quality Linting & Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8 Code Quality Linter
        run: |
          python -m flake8 src/ scripts/ tests/ --count --statistics

      - name: Execute Pytest Unit & Integration Test Suite with Coverage
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload Test Coverage Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: coverage.xml

  train-and-package-model:
    name: 2. Automated Data Pipeline, Model Training & MLflow Logging
    needs: lint-and-unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 2a - Data Acquisition & Preprocessing
        run: |
          python scripts/01_eda_and_cleaning.py

      - name: Step 2b - Model Training, CV Tuning, MLflow Tracking & Packaging
        run: |
          python scripts/02_feature_engineering_and_modeling.py

      - name: Step 2c - Standalone Packaged Pipeline Inference Check
        run: |
          python scripts/03_inference_and_verification.py

      - name: Upload Packaged Model, MLflow Runs & Diagnostic Plots
        uses: actions/upload-artifact@v4
        with:
          name: packaged-model-and-reports
          path: |
            models/
            reports/
            data/processed/

  container-and-k8s-verification:
    name: 3. Docker Container Build, API Smoke Test & Helm/K8s Validation
    needs: train-and-package-model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Packaged Model Artifacts
        uses: actions/download-artifact@v4
        with:
          name: packaged-model-and-reports
          path: .

      - name: Build Production Docker Image
        run: |
          docker build -t cardio-risk-api:${{ github.sha }} -t cardio-risk-api:latest .

      - name: Run Isolated Container & Verify /health, /predict, and /metrics
        run: |
          docker run -d --name cardio-api-test -p 8000:8000 cardio-risk-api:latest
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health > health_response.json 2>/dev/null; then
              echo "Container healthy on attempt $i:"
              cat health_response.json
              echo ""
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          echo ""
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":58,"sex":1,"cp":4,"trestbps":140,"chol":260,"fbs":0,"restecg":2,"thalach":135,"exang":1,"oldpeak":2.2,"slope":2,"ca":2,"thal":7}'
          echo ""
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":41,"sex":0,"cp":2,"trestbps":118,"chol":195,"fbs":0,"restecg":0,"thalach":172,"exang":0,"oldpeak":0.0,"slope":1,"ca":0,"thal":3}'
          echo ""
          curl -fsS http://localhost:8000/metrics -o metrics_output.txt
          head -n 25 metrics_output.txt
          docker logs cardio-api-test > container_smoke_test.log 2>&1
          cat container_smoke_test.log
          docker stop cardio-api-test

      - name: Validate Helm Chart & Render Kubernetes Manifests
        run: |
          helm lint helm/heart-disease-api
          helm template cardio-release helm/heart-disease-api > rendered_k8s_manifests.yaml
          head -n 40 rendered_k8s_manifests.yaml

      - name: Upload Container & Kubernetes Verification Logs
        uses: actions/upload-artifact@v4
        with:
          name: container-and-k8s-verification-logs
          path: |
            container_smoke_test.log
            metrics_output.txt
            rendered_k8s_manifests.yaml
