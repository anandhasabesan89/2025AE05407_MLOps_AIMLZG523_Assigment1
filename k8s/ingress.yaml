apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cardio-risk-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: cardio-risk.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cardio-risk-api-service
                port:
                  number: 80
