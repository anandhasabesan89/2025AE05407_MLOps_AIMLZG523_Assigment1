apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardio-risk-api
  labels:
    app: cardio-risk-api
    tier: inference
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cardio-risk-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cardio-risk-api
        tier: inference
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: cardio-risk-api
          image: cardio-risk-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MODEL_PATH
              value: "/app/models/heart_disease_pipeline.joblib"
            - name: METADATA_PATH
              value: "/app/models/model_metadata.json"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
