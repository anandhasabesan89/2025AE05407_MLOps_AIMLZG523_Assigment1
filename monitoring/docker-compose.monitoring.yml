version: "3.9"

services:
  cardio-risk-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: cardio-risk-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cardio-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - cardio-risk-api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    container_name: cardio-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
